<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>MISMO Board Attendance</title>
<!--
  MISMO Board attendance (Jonna, 2026-11-06).
  The Board of Directors card in Summit HQ (People) emails each board member their own link
  here, with In Person / Virtually / Not able to attend buttons (a = in, virt or no). The
  page asks them to confirm, then posts to the "Summit HQ - Team Travel Answers" flow (the
  same one the team travel form uses), which saves it to feeds/team-travel-answers; Summit HQ
  matches the code (t) to the board member and marks them on the Board card.
  The pick is never sent on page load, so a mail scanner opening the link records nothing.
-->
<style>
  :root{--navy:#0d314c;--sky:#74bfeb;--ink:#0d314c;--ink2:#3d5468;--ink3:#6c899f;--line:#d5e2ed;--wash:#f1f6fa;--bg:#f1f6fa;--card:#ffffff;--err:#b4541a}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:#e6eef5;--ink2:#b9cad8;--ink3:#8aa3b7;--line:#2c4357;--wash:#16283a;--bg:#0b1824;--card:#112233}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.5}
  .wrap{max-width:640px;margin:0 auto;padding:24px 16px 48px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .hd{background:#0d314c;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .logo{background:#fff;border-radius:5px;padding:8px 12px;display:inline-flex}
  .logo img{display:block;width:132px;height:20px}
  .hd span{color:#a9d8f3;font-size:13px;font-weight:600}
  .bar{height:3px;background:#74bfeb}
  .bd{padding:24px}
  h1{font-size:22px;line-height:1.25;margin:0 0 4px}
  .sub{color:var(--ink3);font-size:13px;margin:0 0 18px}
  p{margin:0 0 14px}
  fieldset{border:0;padding:0;margin:0 0 18px}
  legend,label.lab{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--ink);margin:0 0 8px}
  .opts{display:flex;gap:10px;flex-wrap:wrap}
  .opts label{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:6px;padding:10px 14px;cursor:pointer;background:var(--card);font-size:15px}
  .opts input{accent-color:#0d314c;width:18px;height:18px;margin:0}
  .opts label:has(input:checked){border-color:#0d314c;box-shadow:inset 0 0 0 1px #0d314c}
  .row{display:flex;gap:14px;flex-wrap:wrap;margin:0 0 18px}
  .row > div{flex:1 1 200px}
  input[type=date],textarea{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
  textarea{min-height:84px;resize:vertical}
  .hint{font-size:13px;color:var(--ink3);margin-top:4px}
  button{background:#0d314c;color:#fff;border:0;border-radius:6px;padding:14px 26px;font:inherit;font-weight:700;font-size:15px;cursor:pointer}
  button:disabled{opacity:.5;cursor:not-allowed}
  .msg{border-left:3px solid var(--sky);background:var(--wash);padding:12px 14px;border-radius:6px;margin:0 0 16px;font-size:15px}
  .msg.err{border-color:var(--err)}
  .ft{background:#0d314c;color:#a9d8f3;font-size:12px;padding:14px 24px}
  [hidden]{display:none !important}
  .pick{display:grid;gap:10px;margin:0 0 18px}
  .pick label{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:8px;padding:14px 16px;cursor:pointer;background:var(--card);font-size:16px;font-weight:700}
  .pick label small{display:block;font-weight:400;font-size:13px;color:var(--ink3)}
  .pick input{accent-color:#0d314c;width:20px;height:20px;margin:0;flex:0 0 auto}
  .pick label:has(input:checked){border-color:#0d314c;box-shadow:inset 0 0 0 1px #0d314c;background:var(--wash)}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="hd"><div class="logo"><img src="https://resources.mismo.org/member-360/mismo-logo-email.png" alt="MISMO"></div><span>MISMO Summit</span></div>
    <div class="bar"></div>
    <div class="bd">
      <h1 id="title">Joining Us In Person or Virtually?</h1>
      <div class="sub" id="sub"></div>
      <div id="bad" class="msg err" hidden>This link is missing its code. Please use the link in your email from MISMO.</div>
      <form id="f" hidden novalidate>
        <p id="hi"></p>
        <div class="pick" role="radiogroup" aria-label="How you are attending">
          <label><input type="radio" name="how" value="in"><span>In Person<small>We&rsquo;ll register you to attend on site.</small></span></label>
          <label><input type="radio" name="how" value="virt"><span>Virtually<small>We&rsquo;ll register you to join online.</small></span></label>
          <label><input type="radio" name="how" value="no"><span>Not Able to Attend<small>We&rsquo;ll miss you this time.</small></span></label>
        </div>
        <label class="lab" for="notes">Anything we should know? (optional)</label>
        <textarea id="notes" maxlength="500" placeholder="Arriving late, leaving early, anything else"></textarea>
        <div class="hint" style="margin-bottom:18px">Your registration is complimentary as a member of the MISMO Board of Directors. We&rsquo;ll take care of it.</div>
        <div id="err" class="msg err" hidden></div>
        <button type="submit" id="go">Confirm</button>
      </form>
      <div id="done" class="msg" hidden></div>
    </div>
    <div class="ft">MISMO, 1919 M Street NW, 5th Floor, Washington, DC 20036</div>
  </div>
</div>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var get = function(k){ return (q.get(k) || "").trim(); };
  var t=get("t"), v=get("v"), first=get("n"), summit=get("s")||"MISMO Summit", dates=get("d"), a=get("a");
  var $ = function(id){ return document.getElementById(id); };
  var LAB={"in":"in person","virt":"virtually","no":"not able to attend"};
  $("sub").textContent = [summit, dates].filter(Boolean).join(" · ");
  document.title = summit + " · Board Attendance";
  if(!t || !v){ $("bad").hidden=false; return; }
  $("f").hidden=false;
  $("hi").textContent = (first? "Hi "+first+", p" : "P") + "lease confirm how you\u2019ll be joining us so we can register you the right way.";
  if(LAB[a]){ var r=document.querySelector('input[name="how"][value="'+a+'"]'); if(r) r.checked=true; }
  var pick=function(){ var x=document.querySelector('input[name="how"]:checked'); return x? x.value : ""; };
  $("f").addEventListener("submit",function(e){
    e.preventDefault();
    var err=$("err"); err.hidden=true;
    var h=pick();
    if(!h){ err.textContent="Please choose In Person, Virtually or Not Able to Attend."; err.hidden=false; return; }
    var payload={t:t, v:v, going:h, arr:"", dep:"", room:"", park:"", notes:$("notes").value.slice(0,500)};
    var btn=$("go"); btn.disabled=true; btn.textContent="Sending\u2026";
    fetch("travel-endpoint.txt",{cache:"no-store"}).then(function(r){ return r.ok? r.text() : ""; })
      .then(function(url){ url=String(url||"").trim();
        if(!/^https:\/\//.test(url)) throw new Error("no endpoint");
        return fetch(url,{method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain"}, body:JSON.stringify(payload)}); })
      .then(function(){
        $("f").hidden=true;
        var d=$("done"); d.hidden=false;
        d.textContent = h==="no"
          ? "Thank you for letting us know. We\u2019ll miss you this time. If your plans change, use this same link again."
          : "Thank you! We have you joining us "+LAB[h]+", and we\u2019ll take care of your registration. If anything changes, use this same link again.";
      })
      .catch(function(){
        btn.disabled=false; btn.textContent="Confirm";
        err.textContent="That didn\u2019t go through. Please check your connection and try again, or reply to the email."; err.hidden=false;
      });
  });
})();
</script>
</body>
</html>
